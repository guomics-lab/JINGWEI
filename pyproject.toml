[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jingwei"
version = "0.0.1"
description = "Proteomic data imputation framework with DMF and DCAE methods."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm Noncommercial 1.0.0" }
authors = [
    { name = "JINGWEI Contributors" }
]
keywords = ["imputation", "proteomics", "DMF", "DCAE", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tensorboard>=2.13.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0"
]

[project.urls]
License = "https://polyformproject.org/licenses/noncommercial/1.0.0/"

[project.optional-dependencies]
h5ad = ["anndata>=0.10"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jingwei*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["desktop-dist", "build", "results", ".venv", ".r-library", ".r-runtime", ".method-sources"]

